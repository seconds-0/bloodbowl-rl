# Blood Bowl (BB2025) -- PufferLib 5.0 port config (bloodbowl-rl).
# Installed as config/bloodbowl.ini by tools/install_puffer5_env.sh.
# Defaults reproduce chain 30's recipe (D396-D399): r0_poss_half reward knobs,
# 4 frozen banks x 0.12 with the contact bot at tag 4, gamma 0.999 /
# lambda 0.95, H64, 2048 agents, minibatch 16384, replay ratio 1.0, Muon.
# Keys must exist here or in default.ini to be settable from the CLI
# (--section.key=value).
[base]
env_name = bloodbowl
seed = 42
checkpoint_interval = 381
eval_episodes = 10000
# 4.0 trained synchronously; the stale async actor is benchmarked separately.
async = 0
# 4.0 contract: training rollouts start every horizon from zero state
# (reset_state=True). 5.0 additionally zeroes state at terminal rows.
reset_every_horizon = 1

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 16
# 4.0 league layout: num_frozen_banks=4, frozen_bank_pct=0.12 per bank.
# int(1024*0.12) = 122 bank rows per buffer per bank = 122 historical envs per
# bank; 488 of 512 envs per buffer carry a bank seat: 488/512 = 0.953125.
num_policies = 5
hist_policy_percent = 0.953125
hist_policy_hidden_size = 512
hist_policy_num_layers = 3

[selfplay]
enabled = 1
max_size = 16
seed = 42
# With league_preseed set the banks are fixed (4.0 swap_winrate 1.1,
# snapshot_interval 1e12, opp_timeout 3e10 never swapped at 3B steps).
opp_timeout_steps = 0
# Pool dir from tools/build_league.py: bank b loads %016d.bin (b = 0..N-1).
# Empty = upstream 5.0 behaviour (opponents drawn from this run's checkpoints).
league_preseed =

[env]
seed = 42
reward_td = 0.4
reward_win = 0.6
reward_draw = 0.0
reward_setup_done = 0.0
reward_setup_autofix = 0.0
reward_ball_gain = 0.05
reward_ball_loss = 0.0
reward_dist_ball = 0.02
reward_dist_endzone = 0.04
reward_dist_pbrs_gamma = 0.0
reward_injury_inflicted = 0.0
reward_injury_taken = 0.0
reward_injury_value_scaled = 0
reward_send_off = 0.0
reward_kickoff_touchback = 0.0
reward_surf_taken = 0.0
reward_surf_inflicted = 0.0
reward_k_kd = 0.1
reward_k_value = 0.5
reward_k_self_injury = 0.0
reward_k_ball = 0.15
reward_k_seq = 0.03
reward_k_turnover = 0.15
reward_possession = 0.015
reward_k_assist = 0.0
reward_rush_cost = 0.015
reward_carrier_exposure = 0.0
reward_carrier_exposure_soft = 0.0
reward_carrier_threat = 0.0
reward_defensive_threat = 0.0
reward_defensive_threat_soft = 0.0
reward_statmatch_scale = 0.0
demo_reset_pct = 0.0
demo_endzone_maxdist = 0
demo_pickup_maxdist = 0
demo_postkick_maxturn = 0
demo_pass_maxrange = 0
skillup_max_players = 4
skillup_max_each = 2
skillup_secondary_pct = 0.0
macro_moves = 0
exclude_team = -1
force_home_team = -1
force_away_team = -1
scripted_opponent = 1
scripted_opponent_type = 0
scripted_opponent_team = 1
scripted_bank_tag = 4
max_decisions = 4096
render_fps = 60

[policy]
hidden_size = 512
num_layers = 3

[train]
gpus = 1
total_timesteps = 3_000_000_000
learning_rate = 0.00028
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.999
gae_lambda = 0.95
# Same formula as 4.0: replay_ratio * total_agents * horizon / minibatch_size
# gradient steps per epoch, each over minibatch_size / horizon learner rows.
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 0.5
max_grad_norm = 1.5
ent_coef = 0.009
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
# Muon momentum (4.0 train.beta1 = 0.95).
momentum = 0.95
minibatch_size = 16384
horizon = 64
vtrace = 0
